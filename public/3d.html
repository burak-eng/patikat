<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6d9c4">
<title>Patikat 3B</title>
<link rel="icon" href="icons/icon-192.png">
<style>
  :root { --ink: #3f3552; --muted: #7a7090; --gold: #e9a94b; --card: rgba(255, 255, 255, 0.86); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f6d9c4; touch-action: none; user-select: none; -webkit-user-select: none;
    font-family: 'Trebuchet MS', system-ui, sans-serif; color: var(--ink); }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 10px); display: flex; justify-content: space-between; align-items: flex-start; padding: 0 12px; pointer-events: none; }
  .pill { background: var(--card); border-radius: 18px; padding: 6px 12px; font-weight: 800; font-size: 17px; box-shadow: 0 4px 14px rgba(60, 40, 80, 0.12); }
  .mid { text-align: center; }
  .mid b { display: block; font-size: 30px; color: #fff; text-shadow: 0 2px 8px rgba(60, 40, 80, 0.35); }
  .mid small { color: #fff; font-weight: 700; text-shadow: 0 1px 4px rgba(60, 40, 80, 0.4); }
  #lives { letter-spacing: 1px; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px;
    background: linear-gradient(180deg, rgba(255, 238, 226, 0.55), rgba(220, 210, 240, 0.7)); text-align: center; }
  .screen.hidden, .hidden { display: none !important; }
  .card { background: var(--card); border-radius: 26px; padding: 22px 20px; max-width: 340px; width: 100%; box-shadow: 0 10px 30px rgba(60, 40, 80, 0.18); }
  h1 { margin: 0 0 6px; font-size: 30px; }
  p { margin: 6px 0; color: var(--muted); line-height: 1.4; }
  .keys { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 4px; font-size: 14px; }
  .keys div { background: rgba(255, 255, 255, 0.7); border-radius: 14px; padding: 8px 6px; }
  .keys b { display: block; font-size: 20px; }
  button { font: inherit; border: 0; cursor: pointer; }
  .big { width: 100%; margin-top: 10px; padding: 15px; border-radius: 20px; font-size: 20px; font-weight: 800; color: #fff;
    background: linear-gradient(180deg, #ffab8a, #ff8f70); box-shadow: 0 6px 16px rgba(255, 143, 112, 0.4); }
  .alt { width: 100%; margin-top: 8px; padding: 12px; border-radius: 18px; font-size: 16px; font-weight: 700; background: rgba(255, 255, 255, 0.8); color: var(--ink); }
  #back { position: fixed; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); pointer-events: auto; padding: 8px 14px; border-radius: 16px;
    background: var(--card); font-weight: 700; font-size: 14px; color: var(--ink); }
  #msg { position: fixed; left: 0; right: 0; top: 30%; text-align: center; font-size: 26px; font-weight: 800; color: #fff; text-shadow: 0 2px 10px rgba(60, 40, 80, 0.45); pointer-events: none; transition: opacity 0.3s; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="hud" id="hud">
  <div class="pill">🐟 <span id="fish">0</span></div>
  <div class="mid"><b id="dist">0 m</b><small id="speedInfo"></small></div>
  <div class="pill" id="lives">❤️❤️❤️</div>
</div>
<div id="msg"></div>
<button id="back" class="hidden">❚❚</button>

<div id="start" class="screen">
  <div class="card">
    <h1>Çatı Koşusu</h1>
    <p>Kedin çatılarda koşuyor, sen arkasından bakıyorsun. Karabaş peşinde!</p><p id="best"></p>
    <div class="keys">
      <div><b>← →</b>Kaydır: şerit değiştir</div>
      <div><b>↑</b>Kaydır: zıpla</div>
      <div><b>↓</b>Kaydır: kay</div>
      <div><b>🐟</b>Balıkları topla</div>
    </div>
    <p>Klimalar zıplanamaz, şerit değiştir! Tabelaların altından kay, süpürgelerin üstünden zıpla.</p>
    <button class="big" id="play">Başla</button>
    <button class="alt" id="home">← Kedi Evi</button>
  </div>
</div>

<div id="pause" class="screen hidden">
  <div class="card">
    <h1>Durdu</h1>
    <button class="big" id="resume">Devam</button>
    <button class="alt" id="home2">← Kedi Evi</button>
  </div>
</div>

<div id="over" class="screen hidden">
  <div class="card">
    <h1 id="overTitle">Yakalandın!</h1>
    <p id="overText"></p>
    <button class="big" id="again">Tekrar oyna</button>
    <button class="alt" id="home3">← Kedi Evi</button>
  </div>
</div>

<script type="module" src="3d.js"></script>
</body>
</html>
